packages:
  - .

verifyDepsBeforeRun: error
strictDepBuilds: true
minimumReleaseAge: 1440
allowBuilds:
  '@sentry/cli': true
  core-js: false
  esbuild: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true
# Refuse a Node outside engines.node on install and on `pnpm run`; without this pnpm only warns.
# Canon: ~/developer/docs/standards/platform-configs.md, rule 3.
engineStrict: true
